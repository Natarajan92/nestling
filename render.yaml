services:
  - type: web
    name: nestling-api
    runtime: python
    autoDeployTrigger: "off"
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: NEBIUS_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: nestling-app
      - key: LANGSMITH_HIDE_INPUTS
        value: "true"
      - key: LANGSMITH_HIDE_OUTPUTS
        value: "true"
      - key: NESTLING_WEB_ORIGINS
        sync: false
