lesson_id: swaddling
items:
- Baby is face-up with the neck above the folded edge
- Head and face stay uncovered
- Arms rest beside the body with elbows slightly bent
- Left corner crosses diagonally before the loose bottom tuck
- Right corner covers the left arm and tucks securely
- Hips and legs have room to move and chest can expand
- Loose fabric is secured without covering the face
- Fabric is lightweight and not heavy or weighted
- Clothing suits room warmth to avoid overheating
- Baby is always placed on the back for sleep
- Swaddling stops at the first signs of rolling
- Every step comes from the cited source page
- Card and icon match the narration
