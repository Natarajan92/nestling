lesson_id: pregnancy_bed_movement
phrasings:
- How do I get into and out of bed during pregnancy?
- How should I roll to my side before getting out of bed?
- How can I support my bump when resting on my side?
- How do I use my arms to sit up from bed when pregnant?
- How do I move my shoulders hips and knees together when getting out of bed?
- How do I reverse the side-roll movement to get back into bed?
