lesson_id: pregnancy_bed_movement
items:
- Individual suitability is checked with midwife or physiotherapist when unsure
- Shoulders hips and knees roll together
- Legs lower as arms push up in one coordinated movement
- Entry reverses the supported movement; resting advice avoids prolonged flat-back
  lying
- Every step and safety point comes from its cited source page
- Qualified maternity clinician or physiotherapist checks movement suitability
- Card and icon match narration; complete instructions remain visible
- Actual video and every scene require human approval
