lesson_id: preparing_body_for_birth
items:
- Preparation is comfort and fitness, with no vaginal-birth guarantee
- Start gradually and adapt activity as pregnancy progresses
- Known health conditions need individual midwife advice
- Stop for discomfort overheating or illness; avoid falls and abdominal impacts
- Every step and safety point comes from its cited source page
- Qualified maternity clinician or physiotherapist checks movement suitability
- Card and icon match narration; complete instructions remain visible
- Actual video and every scene require human approval
