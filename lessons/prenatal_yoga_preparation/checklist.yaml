lesson_id: prenatal_yoga_preparation
items:
- Title and content say class preparation, not a yoga routine
- Healthcare advice precedes exercise and teacher is appropriately qualified
- Equipment is specific to the linked NHS class
- Pain or illness means stop; persistent or concerning symptoms need advice
- Every step and safety point comes from its cited source page
- Qualified maternity clinician or physiotherapist checks movement suitability
- Card and icon match narration; complete instructions remain visible
- Actual video and every scene require human approval
