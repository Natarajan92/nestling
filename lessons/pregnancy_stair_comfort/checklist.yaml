lesson_id: pregnancy_stair_comfort
items:
- Pain advice is conditional and does not diagnose the viewer
- Technique is conditional on pelvic pain and individual advice, not a universal exercise
  drill
- 'If advised for pelvic pain: one step at a time; less painful leg upstairs and more
  painful leg downstairs'
- Physiotherapy and severe-pain medical advice remain explicit
- Bannister support applies to difficult or painful stairs going down
- Every step and safety point comes from its cited source page
- Qualified maternity clinician or physiotherapist checks movement suitability
- Card and icon match narration; complete instructions remain visible
- Actual video and every scene require human approval
