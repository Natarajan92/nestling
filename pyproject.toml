[project]
name = "nestling"
version = "0.1.0"
description = "From bump to baby. Every answer, sourced."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "langgraph>=1.2.19",
    "langsmith>=0.14.16",
    "llama-index-core>=0.14.25",
    "pinecone>=10.2.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nestling", "evals"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "pytest>=9.2.0",
]
