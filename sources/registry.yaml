# Nestling trusted source library (plan §6).
# Every medical, diet and insurance answer must cite one of these IDs.
#
# file            local PDF in sources/pdfs/ (gitignored; never committed)
# verified        title, year and ISBN checked against the PDF's own front matter
# licence         as printed in the document
# ingest_allowed  retrieval.py may only chunk/embed sources marked true
# counts_as       golden-set citation IDs this document satisfies (e.g. one WHO guideline
#                 covers both WHO-POSTNATAL and WHO-NEWBORN)
#
# Before freezing red-flag rules, record the page/section each rule comes from.

