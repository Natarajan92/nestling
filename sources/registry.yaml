# Nestling trusted source library (plan §6).
# Every medical, diet and insurance answer must cite one of these IDs.
#
# file            local PDF in sources/pdfs/ (gitignored; never committed)
# verified        title, year and ISBN checked against the PDF's own front matter
# licence         as printed in the document
# ingest_allowed  retrieval.py may only chunk/embed sources marked true
#
# Before freezing red-flag rules, record the page/section each rule comes from.

sources:
  - id: WHO-ANC
    title: WHO recommendations on antenatal care for a positive pregnancy experience
    publisher: World Health Organization
    year: 2016
    isbn: 978-92-4-154991-2
    url: https://www.who.int/publications/i/item/9789241549912
    pdf: https://apps.who.int/iris/bitstream/10665/250796/1/9789241549912-eng.pdf
    file: WHO-ANC.pdf
    pages: 172
    used_by: [care, guardian]
    licence: All rights reserved (WHO 2016)
    ingest_allowed: true  # owner decision 2026-11-01 (publicly downloadable); request WHO Press permission before public launch
    verified: true
    verified_on: 2026-11-01

  - id: WHO-ANC-ZINC
    title: "WHO antenatal care recommendations for a positive pregnancy experience. Nutritional interventions update: zinc supplements during pregnancy"
    publisher: World Health Organization
    year: 2021
    isbn: 978-92-4-003046-6
    url: null  # add the who.int publication page
    file: WHO-ANC-Zinc-Supplements-during-pregnancy-updated.pdf
    pages: 40
    updates: WHO-ANC  # supersedes the 2016 zinc recommendation
    used_by: [care, nourish]
    licence: CC BY-NC-SA 3.0 IGO
    ingest_allowed: true  # non-commercial use with attribution
    verified: true
    verified_on: 2026-11-01

  - id: WHO-ANC-ULTRASOUND
    title: "WHO antenatal care recommendations for a positive pregnancy experience. Maternal and fetal assessment update: imaging ultrasound before 24 weeks of pregnancy"
    publisher: World Health Organization
    year: 2022  # the file name says 2024, but the document is © WHO 2022
    isbn: 978-92-4-004600-9
    url: null  # add the who.int publication page
    file: WHO-ANC-maternal-and_fetal-assessment-update-2024.pdf
    pages: 43
    updates: WHO-ANC  # supersedes the 2016 ultrasound recommendation
    used_by: [care]
    licence: CC BY-NC-SA 3.0 IGO
    ingest_allowed: true  # non-commercial use with attribution
    verified: true
    verified_on: 2026-11-01

  - id: MOHFW-ANC
    title: Guidelines for Antenatal Care and Skilled Attendance at Birth by ANMs/LHVs/SNs
